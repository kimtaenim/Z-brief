forbidden_patterns:
  description: 출력 본문에서 절대 등장 금지. render.py에서 정규식 검사.
  literal:
    - "—"
    - "~"
  regex:
    - "^-{3,}$"
    - "^={3,}$"
    - "^\\*{3,}$"
  banned_words:
    - 추천
  emoji_block: true
  replacements:
    "—": "-"
    "~": "-"
